name: Build and Release Go Agent

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release Binaries
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Agent Executables
        shell: cmd
        run: build.bat

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/Installer.exe
            dist/agent.exe
            dist/uninstaller.exe
            dist/watchdog.exe
            dist/svc.exe
            dist/ui.exe
            dist/agent-manifest.json
          draft: false
          prerelease: false

  build-and-release-linux:
    name: Build & Publish Linux Binaries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build Linux Agent Binaries
        run: bash build-linux.sh

      # Release assets are keyed by file name, so every platform needs names of its own. Uploading
      # "agent"/"watchdog"/"install.sh" from several jobs (and from both mac architectures) made them delete
      # each other's uploads, and the macOS publish step failed with "Not Found ... delete-a-release-asset".
      - name: Stage uniquely named release assets
        run: |
          mkdir -p release
          cp dist/linux/agent release/agent-linux-amd64
          cp dist/linux/watchdog release/watchdog-linux-amd64
          cp dist/linux/install.sh release/install-linux.sh
          cp dist/linux/uninstall.sh release/uninstall-linux.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/agent-linux-amd64
            release/watchdog-linux-amd64
            release/install-linux.sh
            release/uninstall-linux.sh
          draft: false
          prerelease: false

  build-and-release-mac:
    name: Build & Publish macOS Binaries
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go Environment
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Build macOS Agent Binaries
        run: bash build-mac.sh

      # See the Linux job: asset names must be unique across the whole release.
      - name: Stage uniquely named release assets
        run: |
          mkdir -p release
          for arch in amd64 arm64; do
            cp dist/mac/$arch/agent release/agent-darwin-$arch
            cp dist/mac/$arch/watchdog release/watchdog-darwin-$arch
          done
          cp dist/mac/arm64/install.sh release/install-mac.sh
          cp dist/mac/arm64/uninstall.sh release/uninstall-mac.sh

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            release/agent-darwin-amd64
            release/agent-darwin-arm64
            release/watchdog-darwin-amd64
            release/watchdog-darwin-arm64
            release/install-mac.sh
            release/uninstall-mac.sh
          draft: false
          prerelease: false
